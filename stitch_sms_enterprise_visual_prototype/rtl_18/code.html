<body class="bg-background min-h-screen flex items-center justify-center font-arabic-body text-on-surface antialiased">
<div class="flex w-full max-w-6xl min-h-[600px] bg-surface-container-lowest rounded-xl overflow-hidden border border-outline-variant/30 relative">
<!-- Form Section (Right in RTL, visually right) -->
<div class="w-full md:w-1/2 flex flex-col justify-center px-8 md:px-16 py-12 bg-surface-container-lowest z-10 relative">
<div class="max-w-md w-full mx-auto">
<!-- Logo & Brand -->
<div class="flex items-center mb-10 gap-3">
<div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary" data-icon="school">school</span>
</div>
<span class="font-display-md text-display-md text-on-surface">مدرسة النخبة</span>
</div>
<!-- Header -->
<div class="mb-8">
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">تسجيل الدخول</h1>
<p class="font-arabic-body text-arabic-body text-on-surface-variant">مرحباً بك مجدداً، يرجى إدخال بياناتك للوصول إلى النظام</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-5">
<!-- Email Input -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-1" for="email">البريد الإلكتروني</label>
<div class="relative custom-focus-ring border border-outline-variant rounded-DEFAULT bg-surface-container-lowest transition-colors flex items-center h-10 px-3">
<span class="material-symbols-outlined text-on-surface-variant ml-2 text-[20px]" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-default text-body-default text-on-surface outline-none" id="email" name="email" placeholder="name@school.edu" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-1" for="password">كلمة المرور</label>
<div class="relative custom-focus-ring border border-outline-variant rounded-DEFAULT bg-surface-container-lowest transition-colors flex items-center h-10 px-3">
<span class="material-symbols-outlined text-on-surface-variant ml-2 text-[20px]" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-default text-body-default text-on-surface outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="mr-2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center justify-between mt-4">
<label class="flex items-center cursor-pointer">
<input class="w-4 h-4 rounded-sm border-outline-variant text-primary-container focus:ring-primary-container bg-surface-container-lowest" type="checkbox"/>
<span class="mr-2 font-arabic-body text-arabic-body text-on-surface">تذكرني</span>
</label>
<a class="font-arabic-body text-arabic-body text-primary-container hover:underline font-medium" href="#">نسيت كلمة المرور؟</a>
</div>
<!-- Submit Button -->
<button class="w-full h-10 bg-primary-container text-on-primary font-title-sm text-title-sm rounded-DEFAULT hover:opacity-90 active:opacity-80 transition-opacity mt-6 flex items-center justify-center" type="submit">
                        دخول
                    </button>
</form>
<!-- Footer -->
<div class="mt-12 text-center">
<p class="font-arabic-body text-arabic-body text-on-surface-variant text-[12px]">جميع الحقوق محفوظة © مدرسة النخبة ٢٠٢٤</p>
</div>
</div>
</div>
<!-- Image Section (Left in RTL, visually left) -->
<div class="hidden md:block w-1/2 relative bg-surface-container-low border-r border-outline-variant/30">
<div class="absolute inset-0 bg-primary-container/10 mix-blend-multiply z-10"></div>
<div class="absolute inset-0 w-full h-full bg-cover bg-center grayscale-[20%]" data-alt="A clean, modern school library interior bathed in natural sunlight. Rows of meticulously organized bookshelves create a deep perspective. The architecture features modern white surfaces, warm oak wood accents, and large windows casting soft, diffused light across the reading tables. The aesthetic is calm, highly professional, and academic, fitting perfectly within a modern corporate design system characterized by structural reliability and neutral tones." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCRgIU8nJuvis2tlKdV8HmNA5mmPVN5MVSea3jeWzXKIlyhqjAkV24vkv6dPPLf7m2H-QAau7EPWibY6tDf4vGpX2AVE07TPabyPdxxGBrx-38y0RL7YOizjFwn7tXhw_OOGMFCGKtz8Lf9Kqp2mC2b7wHQ3a3JMwq9m8-V4_WMW7Y5IFeQp5YEymHaBilBStM5V8g3iFQQypvXa3mVQEvQbv2vRDFf787pnWW3ABgcMleF6GnhYdih')"></div>
<!-- Optional overlay graphic -->
<div class="absolute inset-0 bg-gradient-to-tr from-surface/80 to-transparent z-10"></div>
<div class="absolute bottom-12 right-12 z-20 max-w-sm">
<div class="bg-surface-container-lowest/90 backdrop-blur-[4px] p-6 rounded-lg border border-outline-variant/50">
<h2 class="font-title-sm text-title-sm text-on-surface mb-2">نظام الإدارة الموحد</h2>
<p class="font-arabic-body text-arabic-body text-on-surface-variant leading-relaxed">منصة متكاملة لإدارة شؤون الطلاب، الهيكل الأكاديمي، والتقارير بكفاءة وموثوقية عالية.</p>
</div>
</div>
</div>
</div>
